<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>BOSS Timer Remote</title>

<style>
body {
  margin: 0;
  padding: 12px;
  background: #0f172a;
  font-family: system-ui, sans-serif;
  color: #e5e7eb;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.card {
  background: #020617;
  border: 2px solid #334155;
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
}

.name {
  font-size: 20px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 6px;
}

.time {
  font-size: 32px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 8px;
}

.time.ready {
  color: #f87171;
}

.bar-bg {
  width: 100%;
  height: 14px;
  background: #1e293b;
  border-radius: 7px;
  overflow: hidden;
}

.bar {
  height: 100%;
  background: #22c55e;
  width: 0%;
}
</style>
</head>

<body>

<div class="grid" id="grid"></div>

<script>
const AUTO_REFRESH_DELAY = 3 * 60 * 1000;

const bosses = [
  { name: "OCT", interval: 240 },
  { name: "DRG", interval: 120 },
  { name: "LRD", interval: 180 },
  { name: "HYD", interval: 90 },
  { name: "GNT", interval: 60 },
  { name: "SPH", interval: 150 },
  { name: "DMN", interval: 200 },
  { name: "WLF", interval: 80 },
  { name: "TIT", interval: 300 },
  { name: "CRB", interval: 110 },
  { name: "PHX", interval: 210 },
  { name: "SLM", interval: 45 }
].map(b => {
  const now = Date.now();
  return {
    ...b,
    last: now,
    next: now + b.interval * 60000
  };
});

const grid = document.getElementById("grid");

function formatRemain(ms) {
  if (ms <= 0) return "READY";
  const m = Math.floor(ms / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function render() {
  grid.innerHTML = "";
  const now = Date.now();

  bosses.forEach((b, i) => {
    if (now > b.next + AUTO_REFRESH_DELAY) {
      b.last = b.next;
      b.next = b.last + b.interval * 60000;
    }

    const remain = b.next - now;
    const percent = Math.min(
      100,
      Math.max(0, 100 - (remain / (b.interval * 60000)) * 100)
    );

    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => {
      const t = Date.now();
      b.last = t;
      b.next = t + b.interval * 60000;
    };

    card.innerHTML = `
      <div class="name">${b.name}</div>
      <div class="time ${remain <= 0 ? "ready" : ""}">
        ${formatRemain(remain)}
      </div>
      <div class="bar-bg">
        <div class="bar" style="width:${percent}%"></div>
      </div>
    `;
    grid.appendChild(card);
  });
}

setInterval(render, 1000);
render();
</script>

</body>
</html>
